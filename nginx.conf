server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/x-component;

  # Aset ber-hash dari build: aman di-cache selamanya.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Data halaman Next.js (static export): /outlets.txt, /index.txt, dst.
  # Router Next.js mengambilnya saat menu diklik, selalu dengan header "RSC: 1".
  location ~ ^/(?<page>.+)\.txt$ {
    # Dibuka langsung di tab browser (bukan oleh router) -> arahkan ke halaman aslinya,
    # supaya pengguna tidak pernah melihat isi mentah file .txt.
    if ($http_rsc = "") {
      return 302 /$page;
    }
    # Tipe resmi RSC agar router Next.js selalu menerimanya sebagai data halaman.
    types { }
    default_type text/x-component;
    add_header Cache-Control "no-cache";
    add_header Vary "RSC";
    try_files $uri =404;
  }

  # Halaman HTML: selalu cek versi terbaru setelah deploy (hindari HTML lama + build baru).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
